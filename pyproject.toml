[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shared-low-dimensional-operator"
version = "0.1.0"
description = "Code for testing shared low-dimensional operator representations in time-varying financial dynamics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["state-space", "causal-discovery", "financial-networks", "risk", "kalman-filter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "tqdm>=4.66",
  "joblib>=1.3",
  "psutil>=5.9",
  "matplotlib>=3.8",
  "tushare>=1.4.29,<2",
]

[project.urls]
Homepage = "https://github.com/SrarrySky/2026ICMLSession2"
Repository = "https://github.com/SrarrySky/2026ICMLSession2"
Issues = "https://github.com/SrarrySky/2026ICMLSession2/issues"

[project.optional-dependencies]
causal = ["tigramite>=5.2"]
hmm = ["hmmlearn>=0.3.3"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "nbformat>=5.10",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
dlcssm = "cli:app"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's CLI declarations intentionally construct Option objects in function
# defaults; B008 is not actionable for this API style.
"src/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
