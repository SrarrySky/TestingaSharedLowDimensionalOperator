seed: 42
lag: 3
state_dimension: 2

selection:
  # Forecast x_t before observing x_t or u_t; both equations use u_{t-1}.
  # "conditional" is supported explicitly for conditional-density diagnostics.
  covariate_policy: persistence

fit:
  max_em_iterations: 80
  min_em_iterations: 5
  tolerance: 1.0e-5
  prox_iterations: 200
  covariance_jitter: 1.0e-6
  diagonal_observation_covariance: true
  canonicalize_after_fit: true

penalty:
  # Fixed before Validation/Test; multiplies group and state-L1 penalties on Tier B.
  tier_b_multiplier: 2.0
  group: 0.001
  state_l1: 0.0005
  ridge: 1.0e-6

stability:
  validation_reject_if_spectral_radius_above: 1.02
  diagnostic_state_quantiles: [0.05, 0.50, 0.95]

geometry:
  horizons: [3, 5, 10]
  discount: 0.95
  epsilon: 1.0e-10

uncertainty:
  posterior_draws: 500
  predictive_path_draws: 500
  credible_interval: 0.95

hyperparameter_grid:
  state_dimension: [1, 2, 3, 4]
  lag: [1, 2, 3, 5]
  group_penalty: [0.0003, 0.001, 0.003]
  state_l1_penalty: [0.0001, 0.0005, 0.001]
